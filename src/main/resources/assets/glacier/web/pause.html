<div class="pz-root" id="pz-root">
  <div class="pz-top">
    <div class="pz-panel">
      <img class="pz-art" src="glacier:textures/screens/pause_screen.png" alt="">
      <button id="pz-return" class="pz-btn pz-accent pz-a">Return to Game</button>
      <button id="pz-quit" class="pz-btn pz-card pz-b">Disconnect</button>
      <button id="pz-adv" class="pz-btn pz-card pz-c">Achievements</button>
      <button id="pz-wardrobe" class="pz-btn pz-card pz-d">Wardrobe</button>
      <button id="pz-shot" class="pz-btn pz-card pz-e">Take Screenshot</button>
      <button id="pz-options" class="pz-btn pz-card pz-f">Options</button>
      <button id="pz-info" class="pz-btn pz-card pz-g">Information</button>
      <button id="pz-mods" class="pz-btn pz-pill pz-h">Mods</button>
      <button id="pz-share" class="pz-btn pz-pill pz-i">Open to LAN</button>
      <div id="pz-infotext" class="pz-infotext" style="display: none">Glacier Client v7 on Minecraft 1.21.11</div>
    </div>
  </div>

  <div class="pz-status">
    <div class="pz-status-label">Game Status:</div>
    <div class="pz-status-row">
      <i class="fa pz-status-ico">&#xf04c;</i>
      <span class="pz-status-text">Paused</span>
    </div>
  </div>

  <div id="pz-confirm" class="pz-confirm" style="display: none">
    <div class="pz-dim"></div>
    <div class="pz-cbox">
      <div class="pz-ctitle">Leave this world?</div>
      <div class="pz-csub">Your progress is saved.</div>
      <div class="pz-crow">
        <button id="pz-cancel" class="pz-cbtn pz-pill">Cancel</button>
        <button id="pz-leave" class="pz-cbtn pz-accent">Disconnect</button>
      </div>
    </div>
  </div>
</div>
