<div class="pg-root">
  <div class="pg-center">
    <div class="pg-card">
      <div class="pg-brand">
        <div class="pg-inset"><img class="pg-logo" src="glacier:textures/ui/logo.png" alt=""></div>
        <img class="pg-word" src="glacier:textures/start/wordmark.png" alt="">
      </div>
      <div class="pg-status">
        <div class="pg-spin"><i id="pg-spin" class="fa pg-spin-ico">&#xf1ce;</i></div>
        <div id="pg-title" class="pg-title">Loading</div>
        <div class="pg-chip"><span id="pg-pct" class="pg-pct">0%</span></div>
      </div>
      <div class="pg-track"><div id="pg-fill" class="pg-fill"></div></div>
      <button id="pg-exit" class="pg-exit">Exit</button>
    </div>
  </div>
</div>
