plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	mixin {
		defaultRefmapName = "glacier.refmap.json"
	}

	runs {
		client {
			// Mirrors net.glacier.perf.JvmArgs.TEXT (Performance page copy box). Keep both in sync.
			vmArgs([
				"-Xms1G", "-Xmx3G",
				"-XX:+UseG1GC",
				"-XX:MaxGCPauseMillis=200",
				"-XX:+ParallelRefProcEnabled",
				"-XX:+UnlockExperimentalVMOptions",
				"-XX:+DisableExplicitGC",
				"-XX:G1NewSizePercent=30",
				"-XX:G1MaxNewSizePercent=40",
				"-XX:G1ReservePercent=20",
				"-XX:SurvivorRatio=32",
				"-XX:MaxTenuringThreshold=1",
				"-XX:+PerfDisableSharedMem"
			])
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Pure-Java JavaScript engine for the custom UI scripting layer (bundled into the jar)
	include implementation("org.mozilla:rhino:1.7.15")

	// Built-in performance mods (jar-in-jar, unmodified). Credits: assets/glacier/THIRD_PARTY.md
	include modImplementation("maven.modrinth:sodium:mc1.21.11-0.8.14-fabric")
	include modImplementation("maven.modrinth:lithium:mc1.21.11-0.21.4-fabric")
	include modImplementation("maven.modrinth:ferrite-core:8.2.0-fabric")
	include modImplementation("maven.modrinth:immediatelyfast:1.14.3+1.21.11-fabric")

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.test {
	useJUnitPlatform()
}

processResources {
	def props = ["version": project.version]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
